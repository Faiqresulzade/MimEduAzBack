services:
  postgres:
    image: postgres:16-alpine
    container_name: mimedu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mimedu_dev
    ports:
      - "5434:5432"
    volumes:
      - mimedu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mimedu_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mimedu-pgdata:
