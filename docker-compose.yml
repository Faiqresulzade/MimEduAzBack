services:
  mysql:
    image: mariadb:10.6
    container_name: mimedu-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: mimedu_dev
      MARIADB_USER: mimedu
      MARIADB_PASSWORD: mimedu
    ports:
      - "3307:3306"
    volumes:
      - mimedu-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mimedu-mysqldata:
